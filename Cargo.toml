[package]
name = "ifonts"
version = "1.1.0"
edition = "2024"
authors = ["Erning"]
description = "A command-line tool to generate .mobileconfig files for iOS font installation"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
base64 = "0.23.1"
anyhow = "1.0.104"
uuid = { version = "1.29.0", features = ["v4"] }
